openapi: 3.1.0
info:
  title: GUI-LOP API
  description: |
    ## Generative UI & Human-in-the-Loop Orchestration Platform API

    The GUI-LOP API provides comprehensive endpoints for authentication, workflow management,
    real-time communication, and system monitoring. This API supports:

    - JWT-based authentication with refresh tokens
    - Workflow creation, execution, and management
    - Real-time WebSocket communication
    - Rate limiting and security features
    - Comprehensive error handling
    - API versioning and backward compatibility

    ### Authentication
    The API uses JWT (JSON Web Tokens) for authentication. Include the access token
    in the Authorization header:

    ```
    Authorization: Bearer <access_token>
    ```

    ### Rate Limiting
    API endpoints are rate-limited to prevent abuse. Rate limit information is
    included in response headers:

    - `X-RateLimit-Limit`: Maximum requests per window
    - `X-RateLimit-Remaining`: Remaining requests in current window
    - `X-RateLimit-Reset`: Time when rate limit resets (Unix timestamp)

    ### Error Responses
    All error responses follow a consistent format:

    ```json
    {
      "success": false,
      "message": "Error description",
      "code": "ERROR_CODE",
      "details": {...},
      "timestamp": "2024-01-01T00:00:00.000Z"
    }
    ```

    ### Pagination
    List endpoints support pagination using:
    - `page`: Page number (default: 1)
    - `limit`: Items per page (default: 20, max: 100)

    Response includes pagination metadata:
    ```json
    {
      "data": [...],
      "pagination": {
        "page": 1,
        "limit": 20,
        "total": 100,
        "totalPages": 5,
        "hasNext": true,
        "hasPrev": false
      }
    }
    ```
  version: 1.0.0
  termsOfService: https://gui-lop.example.com/terms
  contact:
    name: GUI-LOP API Support
    email: api-support@gui-lop.example.com
    url: https://gui-lop.example.com/support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:3001/api/v1
    description: Development server
  - url: https://api.gui-lop.example.com/v1
    description: Production server
  - url: https://staging-api.gui-lop.example.com/v1
    description: Staging server

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Authentication
    description: User authentication and authorization endpoints
  - name: Workflows
    description: Workflow management and execution endpoints
  - name: Users
    description: User profile and management endpoints
  - name: Public
    description: Public endpoints accessible without authentication
  - name: System
    description: System monitoring and health check endpoints
  - name: WebSocket
    description: WebSocket connection and real-time communication

paths:
  # Authentication Endpoints
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      description: |
        Create a new user account with email and password. The password must meet
        security requirements: at least 8 characters with uppercase, lowercase,
        number, and special character.
      operationId: registerUser
      security: [] # No authentication required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
            examples:
              standardUser:
                summary: Standard user registration
                value:
                  email: "user@example.com"
                  password: "SecurePass123!"
                  confirmPassword: "SecurePass123!"
                  firstName: "John"
                  lastName: "Doe"
                  role: "user"
              adminUser:
                summary: Admin user registration (requires special permissions)
                value:
                  email: "admin@example.com"
                  password: "AdminPass123!"
                  confirmPassword: "AdminPass123!"
                  firstName: "Admin"
                  lastName: "User"
                  role: "admin"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                successfulRegistration:
                  summary: Successful registration response
                  value:
                    success: true
                    message: "User registered successfully"
                    data:
                      user:
                        id: "user_1234567890_abcdef"
                        email: "user@example.com"
                        firstName: "John"
                        lastName: "Doe"
                        role: "user"
                        isActive: true
                        createdAt: "2024-01-01T00:00:00.000Z"
                      tokens:
                        accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                        refreshToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                        expiresIn: 3600
                    metadata:
                      timestamp: "2024-01-01T00:00:00.000Z"
        '400':
          description: Bad request - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  summary: Validation error example
                  value:
                    success: false
                    message: "Validation failed"
                    code: "VALIDATION_ERROR"
                    details:
                      - field: "email"
                        message: "Valid email is required"
                      - field: "password"
                        message: "Password must be at least 8 characters"
                    timestamp: "2024-01-01T00:00:00.000Z"
        '409':
          description: Conflict - user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user
      description: |
        Authenticate a user with email and password. Returns JWT access and refresh tokens.
        Failed attempts are tracked and accounts may be temporarily locked after
        multiple failed attempts.
      operationId: loginUser
      security: [] # No authentication required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              standardLogin:
                summary: Standard user login
                value:
                  email: "user@example.com"
                  password: "SecurePass123!"
                  rememberMe: false
              rememberedLogin:
                summary: Login with remember me
                value:
                  email: "user@example.com"
                  password: "SecurePass123!"
                  rememberMe: true
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad request - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: Account locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: |
        Refresh an expired access token using a valid refresh token. Refresh tokens
        are single-use and will be invalidated after use.
      operationId: refreshToken
      security: [] # No authentication required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          description: Bad request - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout user
      description: |
        Logout the current user and revoke tokens. Accepts optional refresh token
        to revoke specific session. All user tokens can be revoked for complete logout.
      operationId: logoutUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current user profile
      description: Retrieve the profile information of the currently authenticated user.
      operationId: getCurrentUser
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change user password
      description: |
        Change the current user's password. Requires current password for verification
        and will revoke all existing tokens, forcing re-login.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
        '400':
          description: Bad request - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Workflow Endpoints
  /workflows:
    get:
      tags: [Workflows]
      summary: Get user workflows
      description: |
        Retrieve a paginated list of workflows belonging to the current user.
        Supports filtering by status, template, and date range.
      operationId: getUserWorkflows
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/WorkflowStatusFilter'
        - $ref: '#/components/parameters/WorkflowTemplateFilter'
        - $ref: '#/components/parameters/CreatedAfterFilter'
        - $ref: '#/components/parameters/CreatedBeforeFilter'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: Workflows retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Workflows]
      summary: Create new workflow
      description: |
        Create a new workflow based on a template with provided context.
        The workflow will be created in 'draft' status and can be executed later.
      operationId: createWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
            examples:
              simpleWorkflow:
                summary: Simple workflow creation
                value:
                  template: "data-analysis"
                  context:
                    title: "Sales Data Analysis"
                    description: "Analyze Q4 sales data"
                    dataSource: "sales_db"
                  settings:
                    priority: "normal"
                    notifyOnComplete: true
      responses:
        '201':
          description: Workflow created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '400':
          description: Bad request - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workflows/templates:
    get:
      tags: [Workflows]
      summary: Get workflow templates
      description: |
        Retrieve available workflow templates. Authentication is optional but
        authenticated users may see additional templates based on their role.
      operationId: getWorkflowTemplates
      security: [] # Optional authentication
      parameters:
        - $ref: '#/components/parameters/TemplateCategoryFilter'
        - $ref: '#/components/parameters/TemplateComplexityFilter'
      responses:
        '200':
          description: Templates retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplatesResponse'

  /workflows/{workflowId}:
    get:
      tags: [Workflows]
      summary: Get workflow details
      description: Retrieve detailed information about a specific workflow.
      operationId: getWorkflow
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          description: Workflow retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Workflows]
      summary: Update workflow
      description: Update workflow settings, context, or metadata.
      operationId: updateWorkflow
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowRequest'
      responses:
        '200':
          description: Workflow updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '400':
          description: Bad request - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Workflows]
      summary: Delete workflow
      description: |
        Delete a workflow. Only workflows in 'draft', 'completed', or 'failed'
        status can be deleted. Running workflows must be stopped first.
      operationId: deleteWorkflow
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          description: Workflow deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkflowResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied or workflow cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workflows/{workflowId}/execute:
    post:
      tags: [Workflows]
      summary: Execute workflow
      description: |
        Start execution of a workflow. The workflow must be in 'draft' or 'failed'
        status. Execution is asynchronous and status can be monitored via polling
        or WebSocket events.
      operationId: executeWorkflow
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteWorkflowRequest'
      responses:
        '200':
          description: Workflow execution started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteWorkflowResponse'
        '400':
          description: Bad request - workflow cannot be executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Workflow already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workflows/{workflowId}/stop:
    post:
      tags: [Workflows]
      summary: Stop workflow execution
      description: |
        Stop a running workflow. This will gracefully terminate the workflow
        execution and mark it as 'stopped'. Workflow cannot be resumed.
      operationId: stopWorkflow
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          description: Workflow stopped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopWorkflowResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Workflow not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workflows/{workflowId}/respond:
    post:
      tags: [Workflows]
      summary: Respond to workflow
      description: |
        Provide human response to a workflow that is waiting for input.
        Workflows in 'waiting_for_human' status can receive responses with
        approval, rejection, or additional information.
      operationId: respondToWorkflow
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowResponseRequest'
      responses:
        '200':
          description: Response recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponseResponse'
        '400':
          description: Bad request - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Workflow not waiting for response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Public Endpoints
  /public/status:
    get:
      tags: [Public]
      summary: Get public system status
      description: |
        Retrieve public system status and available features. This endpoint
        does not require authentication and provides basic system information.
      operationId: getPublicStatus
      security: [] # No authentication required
      responses:
        '200':
          description: Public status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStatusResponse'

  # System Endpoints
  /health:
    get:
      tags: [System]
      summary: Health check
      description: |
        Comprehensive health check endpoint that returns system status,
        version information, and health of various components.
      operationId: healthCheck
      security: [] # No authentication required
      responses:
        '200':
          description: System healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '503':
          description: System unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /metrics:
    get:
      tags: [System]
      summary: Get system metrics
      description: |
        Retrieve system performance metrics including API usage, workflow statistics,
        and system performance indicators. Requires admin privileges.
      operationId: getSystemMetrics
      parameters:
        - $ref: '#/components/parameters/MetricsTimeframe'
        - $ref: '#/components/parameters/MetricsType'
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMetricsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /docs:
    get:
      tags: [System]
      summary: API documentation
      description: Redirect to Swagger UI for interactive API documentation.
      operationId: getApiDocs
      security: [] # No authentication required
      responses:
        '302':
          description: Redirect to Swagger UI
          headers:
            Location:
              description: Swagger UI URL
              schema:
                type: string
                example: "/api/v1/docs/swagger"

  # WebSocket endpoint is documented separately
  /ws:
    get:
      tags: [WebSocket]
      summary: WebSocket connection endpoint
      description: |
        WebSocket endpoint for real-time communication. Use this endpoint to establish
        a WebSocket connection for receiving real-time updates about workflow status,
        system notifications, and other events.
      operationId: webSocketConnection
      security: [] # Authentication handled via WebSocket message

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained from /auth/login or /auth/refresh endpoints.
        Include in Authorization header: "Bearer <token>"

    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for service-to-service authentication

  parameters:
    WorkflowId:
      name: workflowId
      in: path
      required: true
      description: Unique identifier for the workflow
      schema:
        type: string
        format: uuid
        example: "123e4567-e89b-12d3-a456-426614174000"

    Page:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    Limit:
      name: limit
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    WorkflowStatusFilter:
      name: status
      in: query
      description: Filter workflows by status
      schema:
        type: string
        enum: [draft, running, waiting_for_human, completed, failed, stopped]
      example: "running"

    WorkflowTemplateFilter:
      name: template
      in: query
      description: Filter workflows by template
      schema:
        type: string
        example: "data-analysis"

    CreatedAfterFilter:
      name: createdAfter
      in: query
      description: Filter workflows created after this date
      schema:
        type: string
        format: date-time
      example: "2024-01-01T00:00:00.000Z"

    CreatedBeforeFilter:
      name: createdBefore
      in: query
      description: Filter workflows created before this date
      schema:
        type: string
        format: date-time
      example: "2024-12-31T23:59:59.999Z"

    SortBy:
      name: sortBy
      in: query
      description: Field to sort by
      schema:
        type: string
        enum: [createdAt, updatedAt, startedAt, completedAt, title, status]
        default: createdAt
      example: "createdAt"

    SortOrder:
      name: sortOrder
      in: query
      description: Sort order
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      example: "desc"

    TemplateCategoryFilter:
      name: category
      in: query
      description: Filter templates by category
      schema:
        type: string
        enum: [analytics, decision, content, admin, automation]
        example: "analytics"

    TemplateComplexityFilter:
      name: complexity
      in: query
      description: Filter templates by complexity
      schema:
        type: string
        enum: [beginner, intermediate, advanced, expert]
        example: "intermediate"

    MetricsTimeframe:
      name: timeframe
      in: query
      description: Metrics timeframe
      schema:
        type: string
        enum: [1h, 24h, 7d, 30d, 90d]
        default: 24h
      example: "24h"

    MetricsType:
      name: type
      in: query
      description: Type of metrics to retrieve
      schema:
        type: string
        enum: [all, performance, usage, errors, workflows]
        default: all
      example: "all"

  schemas:
    # Request Schemas
    UserRegistrationRequest:
      type: object
      required: [email, password, confirmPassword, firstName, lastName]
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: "user@example.com"
        password:
          type: string
          minLength: 8
          description: |
            Password must be at least 8 characters with uppercase, lowercase,
            number, and special character
          example: "SecurePass123!"
        confirmPassword:
          type: string
          description: Password confirmation
          example: "SecurePass123!"
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          description: First name
          example: "John"
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          description: Last name
          example: "Doe"
        role:
          type: string
          enum: [user, admin]
          default: user
          description: User role
          example: "user"
      additionalProperties: false

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: "user@example.com"
        password:
          type: string
          description: User password
          example: "SecurePass123!"
        rememberMe:
          type: boolean
          default: false
          description: Keep user logged in longer
          example: false
      additionalProperties: false

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Valid refresh token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      additionalProperties: false

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke specific session
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        revokeAll:
          type: boolean
          default: false
          description: Revoke all user tokens
          example: false
      additionalProperties: false

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword:
          type: string
          description: Current password for verification
          example: "OldPass123!"
        newPassword:
          type: string
          minLength: 8
          description: |
            New password must be at least 8 characters with uppercase, lowercase,
            number, and special character
          example: "NewPass123!"
        confirmPassword:
          type: string
          description: New password confirmation
          example: "NewPass123!"
      additionalProperties: false

    CreateWorkflowRequest:
      type: object
      required: [template, context]
      properties:
        template:
          type: string
          description: Workflow template identifier
          example: "data-analysis"
        context:
          type: object
          description: Workflow context data
          properties:
            title:
              type: string
              description: Workflow title
              example: "Sales Data Analysis"
            description:
              type: string
              description: Workflow description
              example: "Analyze Q4 sales data and generate insights"
            dataSource:
              type: string
              description: Data source identifier
              example: "sales_db"
            parameters:
              type: object
              description: Additional parameters
              additionalProperties: true
          required: [title, description]
        settings:
          type: object
          description: Workflow settings
          properties:
            priority:
              type: string
              enum: [low, normal, high, urgent]
              default: normal
              description: Workflow execution priority
            notifyOnComplete:
              type: boolean
              default: true
              description: Send notification on completion
            timeoutMinutes:
              type: integer
              minimum: 1
              maximum: 1440
              default: 60
              description: Maximum execution time in minutes
            retryAttempts:
              type: integer
              minimum: 0
              maximum: 5
              default: 0
              description: Number of retry attempts on failure
          additionalProperties: false
      additionalProperties: false

    UpdateWorkflowRequest:
      type: object
      properties:
        context:
          type: object
          description: Updated workflow context
          properties:
            title:
              type: string
              description: Workflow title
            description:
              type: string
              description: Workflow description
            parameters:
              type: object
              description: Additional parameters
              additionalProperties: true
        settings:
          type: object
          description: Updated workflow settings
          properties:
            priority:
              type: string
              enum: [low, normal, high, urgent]
              description: Workflow execution priority
            notifyOnComplete:
              type: boolean
              description: Send notification on completion
            timeoutMinutes:
              type: integer
              minimum: 1
              maximum: 1440
              description: Maximum execution time in minutes
      additionalProperties: false

    ExecuteWorkflowRequest:
      type: object
      properties:
        context:
          type: object
          description: Runtime context overrides
          additionalProperties: true
        settings:
          type: object
          description: Runtime setting overrides
          properties:
            priority:
              type: string
              enum: [low, normal, high, urgent]
              description: Execution priority override
            timeoutMinutes:
              type: integer
              minimum: 1
              maximum: 1440
              description: Timeout override in minutes
          additionalProperties: false
      additionalProperties: false

    WorkflowResponseRequest:
      type: object
      required: [action, data]
      properties:
        action:
          type: string
          enum: [approve, reject, request_changes, provide_info]
          description: Response action type
          example: "approve"
        data:
          type: object
          description: Response data
          properties:
            message:
              type: string
              description: Response message
              example: "Approved with minor changes"
            parameters:
              type: object
              description: Additional parameters
              additionalProperties: true
            attachments:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: File name
                  url:
                    type: string
                    description: File URL
                  type:
                    type: string
                    description: MIME type
                required: [name, url, type]
          required: [message]
          additionalProperties: false
      additionalProperties: false

    # Response Schemas
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Login successful"
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            tokens:
              $ref: '#/components/schemas/Tokens'
          required: [user, tokens]
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
      required: [success, message, data, metadata]

    RefreshTokenResponse:
      type: object
