                  type: string
                  format: date-time
                  example: "2024-01-01T00:00:00.000Z"
              required: [isAuthenticated, userRole, totalTemplates, timestamp]
          required: [templates, metadata]
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
      required: [success, message, data, metadata]

    PublicStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Public status retrieved successfully"
        data:
          type: object
          properties:
            message:
              type: string
              example: "GUI-LOP API is running"
            serverTime:
              type: string
              format: date-time
              example: "2024-01-01T00:00:00.000Z"
            features:
              type: array
              items:
                type: string
              example: ["jwt-authentication", "refresh-tokens", "secure-passwords", "rate-limiting"]
            version:
              type: string
              example: "1.0.0"
          required: [message, serverTime, features, version]
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
      required: [success, message, data, metadata]

    HealthCheckResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "System is healthy"
        data:
          type: object
          properties:
            status:
              type: string
              enum: [healthy, unhealthy, degraded]
              example: "healthy"
            timestamp:
              type: string
              format: date-time
              example: "2024-01-01T00:00:00.000Z"
            version:
              type: string
              example: "1.0.0"
            uptime:
              type: integer
              description: Uptime in seconds
              example: 86400
            features:
              type: object
              properties:
                authentication:
                  type: boolean
                  example: true
                websockets:
                  type: boolean
                  example: true
                rateLimiting:
                  type: boolean
                  example: true
                secureHeaders:
                  type: boolean
                  example: true
              required: [authentication, websockets, rateLimiting, secureHeaders]
            checks:
              type: object
              properties:
                database:
                  type: object
                  properties:
                    status:
                      type: string
                      enum: [healthy, unhealthy, degraded]
                      example: "healthy"
                    responseTime:
                      type: integer
                      description: Response time in milliseconds
                      example: 50
                cache:
                  type: object
                  properties:
                    status:
                      type: string
                      enum: [healthy, unhealthy, degraded]
                      example: "healthy"
                    responseTime:
                      type: integer
                      description: Response time in milliseconds
                      example: 10
                externalServices:
                  type: object
                  properties:
                    status:
                      type: string
                      enum: [healthy, unhealthy, degraded]
                      example: "healthy"
                    services:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            example: "notification-service"
                          status:
                            type: string
                            enum: [healthy, unhealthy, degraded]
                            example: "healthy"
                          responseTime:
                            type: integer
                            example: 100
                        required: [name, status, responseTime]
              required: [database, cache]
          required: [status, timestamp, version, uptime, features, checks]
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
      required: [success, message, data, metadata]

    SystemMetricsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Metrics retrieved successfully"
        data:
          type: object
          properties:
            timeframe:
              type: string
              example: "24h"
            generatedAt:
              type: string
              format: date-time
              example: "2024-01-01T00:00:00.000Z"
            metrics:
              type: object
              properties:
                api:
                  type: object
                  properties:
                    totalRequests:
                      type: integer
                      example: 10000
                    averageResponseTime:
                      type: number
                      example: 150.5
                    errorRate:
                      type: number
                      example: 0.02
                    requestsPerMinute:
                      type: number
                      example: 45.2
                workflows:
                  type: object
                  properties:
                    total:
                      type: integer
                      example: 500
                    running:
                      type: integer
                      example: 5
                    completed:
                      type: integer
                      example: 450
                    failed:
                      type: integer
                      example: 45
                    averageExecutionTime:
                      type: number
                      example: 180.5
                users:
                  type: object
                  properties:
                    total:
                      type: integer
                      example: 100
                    active:
                      type: integer
                      example: 25
                    newRegistrations:
                      type: integer
                      example: 5
                system:
                  type: object
                  properties:
                    cpuUsage:
                      type: number
                      example: 45.2
                    memoryUsage:
                      type: number
                      example: 67.8
                    diskUsage:
                      type: number
                      example: 34.5
                    networkIO:
                      type: object
                      properties:
                        bytesIn:
                          type: integer
                          example: 1000000
                        bytesOut:
                          type: integer
                          example: 500000
              required: [api, workflows, users, system]
          required: [timeframe, generatedAt, metrics]
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
      required: [success, message, data, metadata]

    # Shared Schemas
    User:
      type: object
      properties:
        id:
          type: string
          description: Unique user identifier
          example: "user_1234567890_abcdef"
        email:
          type: string
          format: email
          description: User email address
          example: "user@example.com"
        firstName:
          type: string
          description: First name
          example: "John"
        lastName:
          type: string
          description: Last name
          example: "Doe"
        role:
          type: string
          enum: [user, admin]
          description: User role
          example: "user"
        isActive:
          type: boolean
          description: Whether the user account is active
          example: true
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp
          example: "2024-01-01T00:00:00.000Z"
        lastLogin:
          type: string
          format: date-time
          description: Last login timestamp
          example: "2024-01-01T12:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2024-01-01T12:00:00.000Z"
      required: [id, email, firstName, lastName, role, isActive, createdAt]

    Tokens:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: JWT refresh token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        expiresIn:
          type: integer
          description: Access token expiration time in seconds
          example: 3600
        tokenType:
          type: string
          enum: [Bearer]
          example: "Bearer"
      required: [accessToken, expiresIn, tokenType]

    Workflow:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique workflow identifier
          example: "123e4567-e89b-12d3-a456-426614174000"
        template:
          type: string
          description: Workflow template identifier
          example: "data-analysis"
        context:
          type: object
          description: Workflow context data
          properties:
            title:
              type: string
              example: "Sales Data Analysis"
            description:
              type: string
              example: "Analyze Q4 sales data"
            parameters:
              type: object
              additionalProperties: true
        status:
          type: string
          enum: [draft, running, waiting_for_human, completed, failed, stopped]
          description: Current workflow status
          example: "draft"
        userId:
          type: string
          description: Workflow owner ID
          example: "user_1234567890_abcdef"
        settings:
          type: object
          description: Workflow settings
          properties:
            priority:
              type: string
              enum: [low, normal, high, urgent]
              example: "normal"
            notifyOnComplete:
              type: boolean
              example: true
            timeoutMinutes:
              type: integer
              example: 60
        createdAt:
          type: string
          format: date-time
          description: Workflow creation timestamp
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2024-01-01T00:00:00.000Z"
        startedAt:
          type: string
          format: date-time
          description: Execution start timestamp
          example: "2024-01-01T00:05:00.000Z"
        completedAt:
          type: string
          format: date-time
          description: Completion timestamp
          example: "2024-01-01T00:15:00.000Z"
        executedBy:
          type: object
          description: User who executed the workflow
          properties:
            id:
              type: string
              example: "user_1234567890_abcdef"
            email:
              type: string
              example: "user@example.com"
            name:
              type: string
              example: "John Doe"
          required: [id, email, name]
        humanResponse:
          type: object
          description: Human response data
          properties:
            action:
              type: string
              enum: [approve, reject, request_changes, provide_info]
              example: "approve"
            data:
              type: object
              additionalProperties: true
            respondedBy:
              type: object
              properties:
                id:
                  type: string
                  example: "user_1234567890_abcdef"
                email:
                  type: string
                  example: "user@example.com"
                name:
                  type: string
                  example: "John Doe"
              required: [id, email, name]
          required: [action, respondedBy]
      required: [id, template, context, status, userId, createdAt, updatedAt]

    WorkflowTemplate:
      type: object
      properties:
        id:
          type: string
          description: Template identifier
          example: "data-analysis"
        name:
          type: string
          description: Template name
          example: "Data Analysis Workflow"
        description:
          type: string
          description: Template description
          example: "Analyze data and generate insights with human approval"
        steps:
          type: array
          items:
            type: string
          description: Workflow steps
          example: ["Data Ingestion", "Analysis", "Insight Generation", "Human Review", "Final Report"]
        category:
          type: string
          enum: [analytics, decision, content, admin, automation]
          description: Template category
          example: "analytics"
        complexity:
          type: string
          enum: [beginner, intermediate, advanced, expert]
          description: Template complexity
          example: "intermediate"
        requiresAuth:
          type: boolean
          description: Whether authentication is required
          example: true
        estimatedDuration:
          type: string
          description: Estimated execution duration
          example: "15-30 minutes"
        tags:
          type: array
          items:
            type: string
          description: Template tags
          example: ["data", "analysis", "reporting"]
        version:
          type: string
          description: Template version
          example: "1.0.0"
        restrictedTo:
          type: array
          items:
            type: string
            enum: [user, admin]
          description: Roles that can use this template
          example: []
      required: [id, name, description, steps, category, complexity, requiresAuth]

    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          description: Current page number
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Items per page
          example: 20
        total:
          type: integer
          minimum: 0
          description: Total number of items
          example: 100
        totalPages:
          type: integer
          minimum: 0
          description: Total number of pages
          example: 5
        hasNext:
          type: boolean
          description: Whether there's a next page
          example: true
        hasPrev:
          type: boolean
          description: Whether there's a previous page
          example: false
      required: [page, limit, total, totalPages, hasNext, hasPrev]

    ResponseMetadata:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Response timestamp
          example: "2024-01-01T00:00:00.000Z"
        requestId:
          type: string
          format: uuid
          description: Unique request identifier
          example: "123e4567-e89b-12d3-a456-426614174000"
        version:
          type: string
          description: API version
          example: "1.0.0"
        processingTime:
          type: integer
          description: Processing time in milliseconds
          example: 150
      required: [timestamp, requestId, version]

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Human-readable error message
          example: "Request validation failed"
        code:
          type: string
          description: Machine-readable error code
          example: "VALIDATION_ERROR"
        details:
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: Field with error
                    example: "email"
                  message:
                    type: string
                    description: Error message
                    example: "Valid email is required"
                  code:
                    type: string
                    description: Error code for field
                    example: "INVALID_EMAIL"
                required: [field, message]
            - type: object
              additionalProperties: true
          description: Additional error details
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
          example: "2024-01-01T00:00:00.000Z"
        requestId:
          type: string
          format: uuid
          description: Request identifier
          example: "123e4567-e89b-12d3-a456-426614174000"
        path:
          type: string
          description: Request path
          example: "/api/v1/auth/login"
        retryAfter:
          type: integer
          description: Seconds to wait before retrying
          example: 60
      required: [success, message, code, timestamp]

  # Reusable Request Bodies
  requestBodies:
    UserRegistration:
      description: User registration data
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserRegistrationRequest'

    Login:
      description: User login credentials
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'

    RefreshToken:
      description: Refresh token request
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshTokenRequest'

    CreateWorkflow:
      description: Workflow creation data
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateWorkflowRequest'

  # Reusable Responses
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              summary: Unauthorized response
              value:
                success: false
                message: "Authentication required"
                code: "UNAUTHORIZED"
                timestamp: "2024-01-01T00:00:00.000Z"

    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              summary: Forbidden response
              value:
                success: false
                message: "Access denied"
                code: "FORBIDDEN"
                timestamp: "2024-01-01T00:00:00.000Z"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              summary: Not found response
              value:
                success: false
                message: "Resource not found"
                code: "NOT_FOUND"
                timestamp: "2024-01-01T00:00:00.000Z"

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validationError:
              summary: Validation error response
              value:
                success: false
                message: "Request validation failed"
                code: "VALIDATION_ERROR"
                details:
                  - field: "email"
                    message: "Valid email is required"
                timestamp: "2024-01-01T00:00:00.000Z"

    RateLimitExceeded:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rateLimitExceeded:
              summary: Rate limit exceeded response
              value:
                success: false
                message: "Rate limit exceeded"
                code: "RATE_LIMIT_EXCEEDED"
                retryAfter: 60
                timestamp: "2024-01-01T00:00:00.000Z"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalServerError:
              summary: Internal server error response
              value:
                success: false
                message: "Internal server error"
                code: "INTERNAL_ERROR"
                timestamp: "2024-01-01T00:00:00.000Z"

# Custom extensions for additional API information
x-api-gateway:
  rateLimiting:
    default:
      requests: 100
      windowMs: 900000 # 15 minutes
    authentication:
      login:
        requests: 5
        windowMs: 900000
      register:
        requests: 3
        windowMs: 3600000 # 1 hour
    workflows:
      create:
        requests: 10
        windowMs: 900000
      execute:
        requests: 20
        windowMs: 900000

  caching:
    publicEndpoints:
      ttl: 300 # 5 minutes
    userEndpoints:
      ttl: 60 # 1 minute
    workflowTemplates:
      ttl: 1800 # 30 minutes

x-monitoring:
  metrics:
    enabled: true
    endpoint: "/metrics"
    include:
      - request_count
      - request_duration
      - error_rate
      - active_users
      - workflow_count

  logging:
    level: "info"
    format: "json"
    include:
      - request_id
      - user_id
      - ip_address
      - user_agent
      - response_time

x-webhooks:
  workflow:
    completed:
      method: "POST"
      url: "{{user.webhookUrl}}"
      headers:
        Authorization: "Bearer {{user.webhookSecret}}"
      body:
        event: "workflow.completed"
        workflowId: "{{workflow.id}}"
        userId: "{{workflow.userId}}"
        completedAt: "{{workflow.completedAt}}"

    failed:
      method: "POST"
      url: "{{user.webhookUrl}}"
      headers:
        Authorization: "Bearer {{user.webhookSecret}}"
      body:
        event: "workflow.failed"
        workflowId: "{{workflow.id}}"
        userId: "{{workflow.userId}}"
        failedAt: "{{workflow.failedAt}}"
        error: "{{workflow.error}}"

x-versioning:
  current: "v1"
  supported: ["v1"]
  deprecationPolicy:
    noticePeriod: "90 days"
    migrationSupport: true
  backwardCompatibility:
    - "v1"
  migrationGuide:
    v1_to_v2: "https://docs.gui-lop.example.com/api/v2/migration"