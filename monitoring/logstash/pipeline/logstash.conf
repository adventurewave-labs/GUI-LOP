input {
  beats {
    port => 5044
    ssl => true
    ssl_certificate => "/usr/share/logstash/certificates/logstash.crt"
    ssl_key => "/usr/share/logstash/certificates/logstash.key"
  }

  tcp {
    port => 5000
    codec => json_lines
  }

  udp {
    port => 5000
    codec => json
  }

  http {
    port => 8080
    codec => json
  }
}

filter {
  # Parse application logs
  if [fields][logtype] == "application" {
    json {
      source => "message"
      target => "app"
    }

    # Add application metadata
    mutate {
      add_field => { "[@metadata][index_prefix]" => "gui-lop-app" }
    }
  }

  # Parse access logs
  else if [fields][logtype] == "access" {
    grok {
      match => {
        "message" => "%{COMBINEDAPACHELOG}"
      }
    }

    # Parse user agent
    useragent {
      source => "agent"
      target => "user_agent"
    }

    # Convert response time to float
    mutate {
      convert => { "response" => "integer" }
      convert => { "bytes" => "integer" }
    }

    # Add geoip information
    geoip {
      source => "clientip"
      target => "geoip"
    }

    mutate {
      add_field => { "[@metadata][index_prefix]" => "gui-lop-access" }
    }
  }

  # Parse error logs
  else if [fields][logtype] == "error" {
    json {
      source => "message"
      target => "error"
    }

    # Extract stack trace
    if [error][stack] {
      mutate {
        add_field => { "[@metadata][has_stack_trace]" => true }
      }
    }

    mutate {
      add_field => { "[@metadata][index_prefix]" => "gui-lop-error" }
    }
  }

  # Parse security logs
  else if [fields][logtype] == "security" {
    json {
      source => "message"
      target => "security"
    }

    # Add security event categorization
    if [security][event_type] == "authentication" {
      mutate {
        add_field => { "[@metadata][security_category]" => "auth" }
      }
    } else if [security][event_type] == "authorization" {
      mutate {
        add_field => { "[@metadata][security_category]" => "authz" }
      }
    } else if [security][event_type] == "intrusion" {
      mutate {
        add_field => { "[@metadata][security_category]" => "intrusion" }
      }
    }

    mutate {
      add_field => { "[@metadata][index_prefix]" => "gui-lop-security" }
    }
  }

  # Parse performance logs
  else if [fields][logtype] == "performance" {
    json {
      source => "message"
      target => "perf"
    }

    # Convert performance metrics
    if [perf][response_time] {
      mutate {
        convert => { "[perf][response_time]" => "float" }
      }
    }

    if [perf][memory_usage] {
      mutate {
        convert => { "[perf][memory_usage]" => "float" }
      }
    }

    if [perf][cpu_usage] {
      mutate {
        convert => { "[perf][cpu_usage]" => "float" }
      }
    }

    mutate {
      add_field => { "[@metadata][index_prefix]" => "gui-lop-perf" }
    }
  }

  # Parse database logs
  else if [fields][logtype] == "database" {
    json {
      source => "message"
      target => "db"
    }

    # Parse query performance
    if [db][query_time] {
      mutate {
        convert => { "[db][query_time]" => "float" }
      }
    }

    if [db][rows_affected] {
      mutate {
        convert => { "[db][rows_affected]" => "integer" }
      }
    }

    mutate {
      add_field => { "[@metadata][index_prefix]" => "gui-lop-db" }
    }
  }

  # Parse WebSocket logs
  else if [fields][logtype] == "websocket" {
    json {
      source => "message"
      target => "ws"
    }

    # Add WebSocket specific processing
    if [ws][event_type] == "connection" {
      mutate {
        add_field => { "[@metadata][ws_category]" => "connection" }
      }
    } else if [ws][event_type] == "message" {
      mutate {
        add_field => { "[@metadata][ws_category]" => "message" }
      }
    } else if [ws][event_type] == "error" {
      mutate {
        add_field => { "[@metadata][ws_category]" => "error" }
      }
    }

    mutate {
      add_field => { "[@metadata][index_prefix]" => "gui-lop-ws" }
    }
  }

  # Common processing for all log types

  # Parse timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS" ]
      target => "@timestamp"
    }
  }

  # Add environment metadata
  mutate {
    add_field => { "[@metadata][environment]" => "${ENVIRONMENT:production}" }
    add_field => { "[@metadata][cluster]" => "${CLUSTER_NAME:gui-lop}" }
    add_field => { "[@metadata][datacenter]" => "${DATACENTER:default}" }
  }

  # Add processing metadata
  mutate {
    add_field => { "[@metadata][processed_by]" => "logstash" }
    add_field => { "[@metadata][processed_at]" => "%{@timestamp}" }
  }

  # Clean up sensitive data
  if [app][password] {
    mutate {
      remove_field => [ "[app][password]" ]
    }
  }

  if [app][token] {
    mutate {
      remove_field => [ "[app][token]" ]
    }
  }

  if [app][secret] {
    mutate {
      remove_field => [ "[app][secret]" ]
    }
  }

  # Add fingerprint for deduplication
  fingerprint {
    source => ["message", "host", "@timestamp"]
    target => "[@metadata][fingerprint]"
    method => "SHA1"
  }

  # Rate limiting for high-frequency logs
  if [@metadata][fingerprint] {
    throttle {
      key => "[@metadata][fingerprint]"
      period => 10
      max_age => 120
      add_tag => ["throttled"]
    }
  }

  # Enrich with geo data for IP addresses
  if [clientip] {
    geoip {
      source => "clientip"
      target => "geoip"
      database => "/usr/share/logstash/GeoLite2-City.mmdb"
    }
  }

  # Add threat intelligence data
  if [security][ip_address] {
    geoip {
      source => "[security][ip_address]"
      target => "[security][geoip]"
    }
  }
}

output {
  # Main Elasticsearch output
  elasticsearch {
    hosts => ["https://elasticsearch-node-1:9200", "https://elasticsearch-node-2:9200", "https://elasticsearch-node-3:9200"]
    user => "elastic"
    password => "${ELASTICSEARCH_PASSWORD}"
    ssl => true
    ssl_certificate_verification => true
    cacert => "/usr/share/logstash/certificates/ca.crt"
    index => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    template_name => "gui-lop-logs"
    template => "/usr/share/logstash/templates/gui-lop-logs-template.json"
    template_overwrite => true
    manage_template => true
    ilm_enabled => true
    ilm_rollover_alias => "%{[@metadata][index_prefix]}"
    ilm_policy => "gui-lop-logs-policy"
    action => "create"
    retry_on_conflict => 3
    retry_max_interval => 5
    retry_max_items => 500
  }

  # Error output for failed events
  if "_grokparsefailure" in [tags] or "_jsonparsefailure" in [tags] {
    file {
      path => "/usr/share/logstash/logs/failed-events.log"
      codec => json_lines
    }
  }

  # Debug output
  if "${LOGSTASH_DEBUG:false}" == "true" {
    stdout {
      codec => rubydebug
    }
  }

  # Metrics output
  if [@metadata][index_prefix] {
    http {
      url => "http://prometheus-pushgateway:9091/metrics/job/logstash"
      http_method => "post"
      format => "plain"
      mapping => {
        "logstash_events_total" => "1"
        "logstash_events_type" => "%{[@metadata][index_prefix]}"
        "logstash_events_source" => "%{host}"
      }
    }
  }
}