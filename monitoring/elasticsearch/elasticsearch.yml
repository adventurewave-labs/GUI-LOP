cluster.name: gui-lop-logs
node.name: ${HOSTNAME}
path.data: /usr/share/elasticsearch/data
path.logs: /usr/share/elasticsearch/logs

# Network settings
network.host: 0.0.0.0
http.port: 9200
transport.port: 9300

# Discovery settings for multi-node cluster
discovery.seed_hosts: ["elasticsearch-node-1", "elasticsearch-node-2", "elasticsearch-node-3"]
cluster.initial_master_nodes: ["elasticsearch-node-1", "elasticsearch-node-2", "elasticsearch-node-3"]

# Security settings
xpack.security.enabled: true
xpack.security.transport.ssl.enabled: true
xpack.security.transport.ssl.verification: certificate
xpack.security.transport.ssl.certificate: certs/elasticsearch-${HOSTNAME}/elasticsearch-${HOSTNAME}.crt
xpack.security.transport.ssl.key: certs/elasticsearch-${HOSTNAME}/elasticsearch-${HOSTNAME}.key
xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt
xpack.security.http.ssl.enabled: true
xpack.security.http.ssl.certificate: certs/elasticsearch-${HOSTNAME}/elasticsearch-${HOSTNAME}.crt
xpack.security.http.ssl.key: certs/elasticsearch-${HOSTNAME}/elasticsearch-${HOSTNAME}.key
xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt

# Performance settings
bootstrap.memory_lock: true
indices.memory.index_buffer_size: 15%
indices.queries.cache.size: 5%
indices.fielddata.cache.size: 40%

# Index lifecycle management
xpack.ilm.enabled: true

# Monitoring settings
xpack.monitoring.enabled: true
xpack.monitoring.collection.enabled: true

# Machine Learning for anomaly detection
xpack.ml.enabled: true

# Rollup and transform features
xpack.rollup.enabled: true
xpack.transform.enabled: true

# Watcher for alerting
xpack.watcher.enabled: true

# Cross-cluster replication
xpack.ccr.enabled: false

# SQL support
xpack.sql.enabled: true

# Graph analysis
xpack.graph.enabled: true

# Index templates and patterns
action.auto_create_index: "+*,-*reindex*"

# Thread pool settings
thread_pool.write.queue_size: 1000
thread_pool.search.queue_size: 1000
thread_pool.management.queue_size: 1000

# Circuit breaker settings
indices.breaker.total.limit: 70%
indices.breaker.request.limit: 60%
indices.breaker.fielddata.limit: 60%

# Gateway settings
gateway.expected_nodes: 3
gateway.expected_master_nodes: 2
gateway.expected_data_nodes: 2

# Recovery settings
cluster.routing.allocation.disk.threshold_enabled: true
cluster.routing.allocation.disk.watermark.low: 85%
cluster.routing.allocation.disk.watermark.high: 90%
cluster.routing.allocation.disk.watermark.flood_stage: 95%

# Search settings
search.max_buckets: 65536

# Script settings
script.max_compilations_rate: 75/5m

# HTTP settings
http.max_content_length: 100mb
http.compression: true
http.cors.enabled: true
http.cors.allow-origin: "*"
http.cors.allow-methods: OPTIONS, HEAD, GET, POST, PUT, DELETE
http.cors.allow-headers: Authorization,X-Requested-With,Content-Type,Content-Length