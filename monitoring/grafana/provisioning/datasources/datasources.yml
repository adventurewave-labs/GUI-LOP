apiVersion: 1

datasources:
  # Prometheus datasource
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    jsonData:
      timeInterval: 15s
      queryTimeout: 60s
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.52.0
      cacheLevel: 'High'
      disableRecordingRules: false
      incrementalQueryOverlapWindow: 10m
      allowUiUpdates: true
      alertmanagerUid: alertmanager
    secureJsonData: {}

  # Elasticsearch datasource
  - name: Elasticsearch
    type: elasticsearch
    uid: elasticsearch
    url: https://elasticsearch-node-1:9200
    access: proxy
    database: "gui-lop-logs-*"
    jsonData:
      interval: Daily
      timeField: "@timestamp"
      esVersion: 8.15.0
      maxConcurrentShardRequests: 5
      logMessageField: "message"
      logLevelField: "level"
      timeField: "@timestamp"
      keepCookies: []
      tlsAuth: true
      tlsAuthWithCACert: true
      tlsSkipVerify: false
      customQueryParameters: {}
    secureJsonData:
      tlsCACert: |
        -----BEGIN CERTIFICATE-----
        # CA Certificate content here
        -----END CERTIFICATE-----
      username: elastic
      password: ${ELASTICSEARCH_PASSWORD}

  # Jaeger datasource
  - name: Jaeger
    type: jaeger
    uid: jaeger
    url: http://jaeger:16686
    access: proxy
    jsonData:
      tracesToLogs: true
      tracesToLogsTags: ['job', 'instance', 'pod', 'namespace']
      tracesToLogsV2: true
      tracesToLogsUrl: http://kibana:5601/app/discover#/
      tracesToLogsMap: ['traceId', 'spanId']
      serverUrl: http://jaeger:14268/api/traces
      spanBarDuration: 72h
      enabledFeatures: ['trace-to-logs']
      showGantt: false
      showDependencies: true
    secureJsonData: {}

  # Loki datasource (if using)
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    access: proxy
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: jaeger
          matcherRegex: "\"traceId\":\"(\\w+)\""
          name: TraceID
          url: "$${__value.raw}"
          urlDisplayLabel: "View Trace"
    secureJsonData: {}

  # Graphite datasource (if using)
  - name: Graphite
    type: graphitese
    uid: graphite
    url: http://graphite:8080
    access: proxy
    jsonData:
      graphiteVersion: "1.1"
      tlsSkipVerify: false
    secureJsonData: {}

  # InfluxDB datasource
  - name: InfluxDB
    type: influxdb
    uid: influxdb
    url: http://influxdb:8086
    access: proxy
    database: "monitoring"
    jsonData:
      version: Flux
      organization: "gui-lop"
      defaultBucket: "metrics"
      tlsSkipVerify: false
      httpHeaderName1: "Authorization"
    secureJsonData:
      httpHeaderValue1: "Token ${INFLUXDB_TOKEN}"
      token: ${INFLUXDB_TOKEN}

  # PostgreSQL datasource
  - name: PostgreSQL
    type: postgres
    uid: postgresql
    url: postgresql:5432
    database: monitoring
    user: monitoring
    jsonData:
      sslmode: "disable"
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    secureJsonData:
      password: ${POSTGRES_PASSWORD}

  # Redis datasource
  - name: Redis
    type: redis-datasource
    uid: redis
    url: redis:6379
    access: proxy
    jsonData:
      poolSize: 10
      timeout: 10
      pingInterval: 0
      pipelineWindow: 0
      tlsSkipVerify: false
      client: "advanced"
    secureJsonData:
      password: ${REDIS_PASSWORD}

  # Azure Monitor datasource (if using)
  - name: Azure Monitor
    type: grafana-azure-monitor-datasource
    uid: azure-monitor
    jsonData:
      azureAuth: { credentials: {} }
      cloudName: AzureCloud
      subscriptionId: ${AZURE_SUBSCRIPTION_ID}
    secureJsonData:
      clientId: ${AZURE_CLIENT_ID}
      clientSecret: ${AZURE_CLIENT_SECRET}
      tenantId: ${AZURE_TENANT_ID}

  # AWS CloudWatch datasource (if using)
  - name: CloudWatch
    type: cloudwatch
    uid: cloudwatch
    jsonData:
      defaultRegion: us-east-1
      authType: default
      customMetricsNamespaces: "GUI-LOP"
    secureJsonData:
      accessKeyId: ${AWS_ACCESS_KEY_ID}
      secretAccessKey: ${AWS_SECRET_ACCESS_KEY}

  # Datadog datasource (if using)
  - name: Datadog
    type: datadog
    uid: datadog
    jsonData:
      apiUrl: "https://api.datadoghq.com"
      queryTimezone: "UTC"
    secureJsonData:
      apiKey: ${DATADOG_API_KEY}
      applicationKey: ${DATADOG_APPLICATION_KEY}