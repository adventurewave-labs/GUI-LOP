# GUI-LOP Platform Alerting Rules
# Defines comprehensive alerting rules for all system components

groups:
  # Infrastructure Health Alerts
  - name: infrastructure_health
    rules:
      # System resource alerts
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
          component: cpu
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }} for more than 5 minutes."

      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
          service: system
          component: cpu
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }} for more than 2 minutes."

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: system
          component: memory
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }} for more than 5 minutes."

      - alert: CriticalMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 95
        for: 2m
        labels:
          severity: critical
          service: system
          component: memory
        annotations:
          summary: "Critical memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }} for more than 2 minutes."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 15
        for: 5m
        labels:
          severity: warning
          service: system
          component: disk
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is {{ $value }}% available on {{ $labels.device }} at {{ $labels.instance }}."

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 5
        for: 2m
        labels:
          severity: critical
          service: system
          component: disk
        annotations:
          summary: "Critical disk space on {{ $labels.instance }}"
          description: "Disk space is {{ $value }}% available on {{ $labels.device }} at {{ $labels.instance }}."

      - alert: HighDiskIO
        expr: irate(node_disk_io_time_seconds_total[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: system
          component: disk
        annotations:
          summary: "High disk I/O on {{ $labels.instance }}"
          description: "Disk I/O utilization is {{ $value }}% on {{ $labels.instance }}."

      - alert: NetworkHighLatency
        expr: probe_duration_seconds > 0.5
        for: 5m
        labels:
          severity: warning
          service: network
          component: latency
        annotations:
          summary: "High network latency to {{ $labels.instance }}"
          description: "Network latency is {{ $value }}s to {{ $labels.instance }}."

  # Application Health Alerts
  - name: application_health
    rules:
      # Application uptime and availability
      - alert: ApplicationDown
        expr: up{job="gui-lop-app"} == 0
        for: 1m
        labels:
          severity: critical
          service: gui-lop
          component: application
        annotations:
          summary: "GUI-LOP application is down"
          description: "GUI-LOP application on {{ $labels.instance }} has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(http_requests_total{job="gui-lop-app",status_code=~"5.."}[5m]) / rate(http_requests_total{job="gui-lop-app"}[5m]) * 100 > 5
        for: 3m
        labels:
          severity: warning
          service: gui-lop
          component: application
        annotations:
          summary: "High error rate on GUI-LOP application"
          description: "Error rate is {{ $value }}% on {{ $labels.instance }} for more than 3 minutes."

      - alert: CriticalErrorRate
        expr: rate(http_requests_total{job="gui-lop-app",status_code=~"5.."}[5m]) / rate(http_requests_total{job="gui-lop-app"}[5m]) * 100 > 15
        for: 1m
        labels:
          severity: critical
          service: gui-lop
          component: application
        annotations:
          summary: "Critical error rate on GUI-LOP application"
          description: "Error rate is {{ $value }}% on {{ $labels.instance }} for more than 1 minute."

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="gui-lop-app"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: gui-lop
          component: application
        annotations:
          summary: "High response time on GUI-LOP application"
          description: "95th percentile response time is {{ $value }}s on {{ $labels.instance }}."

      - alert: CriticalResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="gui-lop-app"}[5m])) > 5
        for: 2m
        labels:
          severity: critical
          service: gui-lop
          component: application
        annotations:
          summary: "Critical response time on GUI-LOP application"
          description: "95th percentile response time is {{ $value }}s on {{ $labels.instance }}."

      - alert: LowRequestRate
        expr: rate(http_requests_total{job="gui-lop-app"}[5m]) < 0.1
        for: 10m
        labels:
          severity: warning
          service: gui-lop
          component: application
        annotations:
          summary: "Low request rate on GUI-LOP application"
          description: "Request rate is {{ $value }}/s on {{ $labels.instance }}."

  # Database Health Alerts
  - name: database_health
    rules:
      # PostgreSQL alerts
      - alert: PostgreSQLDown
        expr: up{job="postgres-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: database
          component: postgresql
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance {{ $labels.instance }} has been down for more than 1 minute."

      - alert: PostgreSQLHighConnections
        expr: pg_stat_database_numbackends / pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: database
          component: postgresql
        annotations:
          summary: "High PostgreSQL connection usage"
          description: "PostgreSQL connection usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: PostgreSQLSlowQueries
        expr: rate(pg_stat_statements_mean_time_seconds[5m]) > 1
        for: 5m
        labels:
          severity: warning
          service: database
          component: postgresql
        annotations:
          summary: "Slow PostgreSQL queries detected"
          description: "Average query time is {{ $value }}s on {{ $labels.instance }}."

      - alert: PostgreSQLReplicationLag
        expr: pg_replication_lag_seconds > 60
        for: 5m
        labels:
          severity: warning
          service: database
          component: postgresql
        annotations:
          summary: "PostgreSQL replication lag detected"
          description: "Replication lag is {{ $value }}s on {{ $labels.instance }}."

      # Redis alerts
      - alert: RedisDown
        expr: up{job="redis-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: database
          component: redis
        annotations:
          summary: "Redis is down"
          description: "Redis instance {{ $labels.instance }} has been down for more than 1 minute."

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: database
          component: redis
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: RedisHighConnectionCount
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
          service: database
          component: redis
        annotations:
          summary: "High Redis connection count"
          description: "Redis has {{ $value }} connected clients on {{ $labels.instance }}."

      - alert: RedisLowHitRate
        expr: redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total) * 100 < 80
        for: 10m
        labels:
          severity: warning
          service: database
          component: redis
        annotations:
          summary: "Low Redis hit rate"
          description: "Redis hit rate is {{ $value }}% on {{ $labels.instance }}."

  # Elasticsearch Health Alerts
  - name: elasticsearch_health
    rules:
      - alert: ElasticsearchClusterRed
        expr: elasticsearch_cluster_health_status{color="red"} == 1
        for: 1m
        labels:
          severity: critical
          service: elasticsearch
          component: cluster
        annotations:
          summary: "Elasticsearch cluster status is RED"
          description: "Elasticsearch cluster {{ $labels.cluster }} status is RED."

      - alert: ElasticsearchClusterYellow
        expr: elasticsearch_cluster_health_status{color="yellow"} == 1
        for: 5m
        labels:
          severity: warning
          service: elasticsearch
          component: cluster
        annotations:
          summary: "Elasticsearch cluster status is YELLOW"
          description: "Elasticsearch cluster {{ $labels.cluster }} status is YELLOW."

      - alert: ElasticsearchNodeDown
        expr: elasticsearch_node_stats_up == 0
        for: 2m
        labels:
          severity: critical
          service: elasticsearch
          component: node
        annotations:
          summary: "Elasticsearch node is down"
          description: "Elasticsearch node {{ $labels.node }} is down."

      - alert: ElasticsearchHighCPUUsage
        expr: 100 * (elasticsearch_node_stats_process_cpu_percent) > 80
        for: 5m
        labels:
          severity: warning
          service: elasticsearch
          component: node
        annotations:
          summary: "High Elasticsearch CPU usage"
          description: "Elasticsearch node {{ $labels.node }} CPU usage is {{ $value }}%."

      - alert: ElasticsearchHighHeapUsage
        expr: 100 * (elasticsearch_node_stats_jvm_memory_used_bytes / elasticsearch_node_stats_jvm_memory_max_bytes) > 85
        for: 5m
        labels:
          severity: warning
          service: elasticsearch
          component: node
        annotations:
          summary: "High Elasticsearch heap usage"
          description: "Elasticsearch node {{ $labels.node }} heap usage is {{ $value }}%."

      - alert: ElasticsearchLowDiskSpace
        expr: 100 * (elasticsearch_node_stats_fs_available_bytes / elasticsearch_node_stats_fs_total_bytes) < 15
        for: 5m
        labels:
          severity: warning
          service: elasticsearch
          component: node
        annotations:
          summary: "Low Elasticsearch disk space"
          description: "Elasticsearch node {{ $labels.node }} has {{ $value }}% disk space available."

      - alert: ElasticsearchPendingTasks
        expr: elasticsearch_cluster_health_pending_tasks_total > 100
        for: 5m
        labels:
          severity: warning
          service: elasticsearch
          component: cluster
        annotations:
          summary: "High Elasticsearch pending tasks"
          description: "Elasticsearch cluster has {{ $value }} pending tasks."

  # Security Alerts
  - name: security_alerts
    rules:
      - alert: HighFailedLoginRate
        expr: rate(auth_failures_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          service: security
          component: authentication
        annotations:
          summary: "High failed login rate detected"
          description: "Failed login rate is {{ $value }}/s."

      - alert: SuspiciousLoginPattern
        expr: rate(auth_failures_total[5m]) / rate(auth_successes_total[5m]) > 0.5
        for: 5m
        labels:
          severity: critical
          service: security
          component: authentication
        annotations:
          summary: "Suspicious login pattern detected"
          description: "Failed to successful login ratio is {{ $value }}."

      - alert: BruteForceAttack
        expr: rate(auth_failures_total{source_ip!=""}[1m]) > 20
        for: 1m
        labels:
          severity: critical
          service: security
          component: authentication
        annotations:
          summary: "Potential brute force attack from {{ $labels.source_ip }}"
          description: "High failed login rate from IP {{ $labels.source_ip }}: {{ $value }}/s."

      - alert: UnauthorizedAccessAttempt
        expr: rate(unauthorized_access_total[5m]) > 5
        for: 2m
        labels:
          severity: warning
          service: security
          component: authorization
        annotations:
          summary: "Unauthorized access attempts detected"
          description: "Unauthorized access rate is {{ $value }}/s."

      - alert: SuspiciousUserActivity
        expr: rate(user_actions_total{action="suspicious"}[5m]) > 1
        for: 1m
        labels:
          severity: critical
          service: security
          component: monitoring
        annotations:
          summary: "Suspicious user activity detected"
          description: "Suspicious user activity rate is {{ $value }}/s."

  # Performance Alerts
  - name: performance_alerts
    rules:
      - alert: HighAPMErrorRate
        expr: rate(apm_transaction_error_count[5m]) / rate(apm_transaction_count[5m]) * 100 > 10
        for: 5m
        labels:
          severity: warning
          service: apm
          component: application
        annotations:
          summary: "High APM error rate"
          description: "APM error rate is {{ $value }}%."

      - alert: SlowDatabaseQueries
        expr: histogram_quantile(0.95, rate(db_query_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: database
          component: performance
        annotations:
          summary: "Slow database queries detected"
          description: "95th percentile query time is {{ $value }}s."

      - alert: HighWebSocketConnections
        expr: websocket_connections > 1000
        for: 5m
        labels:
          severity: warning
          service: websocket
          component: connection
        annotations:
          summary: "High WebSocket connection count"
          description: "WebSocket connection count is {{ $value }}."

      - alert: WebSocketConnectionErrors
        expr: rate(websocket_connection_errors_total[5m]) > 5
        for: 2m
        labels:
          severity: warning
          service: websocket
          component: error
        annotations:
          summary: "High WebSocket connection error rate"
          description: "WebSocket connection error rate is {{ $value }}/s."

  # Monitoring System Health
  - name: monitoring_health
    rules:
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
          service: monitoring
          component: prometheus
        annotations:
          summary: "Prometheus is down"
          description: "Prometheus instance {{ $labels.instance }} is down."

      - alert: AlertManagerDown
        expr: up{job="alertmanager"} == 0
        for: 1m
        labels:
          severity: critical
          service: monitoring
          component: alertmanager
        annotations:
          summary: "AlertManager is down"
          description: "AlertManager instance {{ $labels.instance }} is down."

      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 2m
        labels:
          severity: warning
          service: monitoring
          component: grafana
        annotations:
          summary: "Grafana is down"
          description: "Grafana instance {{ $labels.instance }} is down."

      - alert: PrometheusTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
          service: monitoring
          component: targets
        annotations:
          summary: "Prometheus target is down"
          description: "Prometheus target {{ $labels.job }}/{{ $labels.instance }} is down."

      - alert: PrometheusScrapeFailure
        expr: scrape_duration_seconds > 30
        for: 5m
        labels:
          severity: warning
          service: monitoring
          component: scraping
        annotations:
          summary: "Prometheus scrape failure"
          description: "Prometheus scrape duration is {{ $value }}s for {{ $labels.job }}/{{ $labels.instance }}."

  # Business Metrics Alerts
  - name: business_metrics
    rules:
      - alert: LowUserEngagement
        expr: rate(user_sessions_total[1h]) < 10
        for: 30m
        labels:
          severity: warning
          service: business
          component: user_activity
        annotations:
          summary: "Low user engagement detected"
          description: "User session rate is {{ $value }}/hour."

      - alert: HighPageLoadTime
        expr: histogram_quantile(0.95, rate(page_load_duration_seconds_bucket[5m])) > 3
        for: 5m
        labels:
          severity: warning
          service: business
          component: user_experience
        annotations:
          summary: "High page load time"
          description: "95th percentile page load time is {{ $value }}s."

      - alert: LowConversionRate
        expr: rate(conversions_total[1h]) / rate(user_sessions_total[1h]) * 100 < 5
        for: 30m
        labels:
          severity: warning
          service: business
          component: conversion
        annotations:
          summary: "Low conversion rate"
          description: "Conversion rate is {{ $value }}%."

      - alert: HighBounceRate
        expr: rate(single_page_sessions_total[1h]) / rate(user_sessions_total[1h]) * 100 > 70
        for: 30m
        labels:
          severity: warning
          service: business
          component: user_experience
        annotations:
          summary: "High bounce rate"
          description: "Bounce rate is {{ $value }}%."