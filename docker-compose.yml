# =============================================================================
# GUI-LOP Compose stack for local development against the new DDD bootstrap.
#
# - Builds the root Dockerfile (multi-stage, alpine, non-root) and runs
#   `node src/backend/bootstrap/index.js` after applying database migrations.
# - Postgres 15 / Redis 7 with healthchecks; `app` waits on both being healthy.
# - Env vars come from a local `.env` file (see `.env.example`). Real secrets
#   never live in the repo (ADR 0022).
#
# Quickstart:
#   cp .env.example .env       # then fill in JWT_SECRET, etc.
#   docker compose up --build  # or `docker-compose up --build`
#
# Optional staging/monitoring stacks live in docker-compose.staging.yml and
# docker-compose.monitoring.yml. Run them as overlays with `-f`.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Application — uses the root Dockerfile and the new bootstrap entry point.
  # The wrapper script under infrastructure/scripts runs migrations first
  # (skipped automatically when DATABASE_URL is empty / in-memory mode).
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gui-lop:local
    container_name: gui-lop-app
    restart: unless-stopped
    command: ["start-with-migrations.sh"]
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://gui_lop:gui_lop@postgres:5432/gui_lop}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      BCRYPT_WORK_FACTOR: ${BCRYPT_WORK_FACTOR:-12}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-200}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gui-lop-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Postgres 15 — primary OLTP store.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: gui-lop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gui_lop}
      POSTGRES_USER: ${POSTGRES_USER:-gui_lop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gui_lop}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gui-lop-postgres-data:/var/lib/postgresql/data
    networks:
      - gui-lop-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-gui_lop} -d ${POSTGRES_DB:-gui_lop}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis 7 — used by the outbox throttle, rate limiter, and WebSocket fan-out.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gui-lop-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - gui-lop-redis-data:/data
    networks:
      - gui-lop-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  gui-lop-network:
    driver: bridge

volumes:
  # Named volume for Postgres so restarts don't blow away dev data.
  gui-lop-postgres-data:
    driver: local
  gui-lop-redis-data:
    driver: local
