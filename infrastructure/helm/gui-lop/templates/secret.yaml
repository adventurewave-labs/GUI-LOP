{{- /*
  PRODUCTION NOTE (ADR 0022):
    Hard-coded secret values in values.yaml are for local / kind / minikube
    only. In production, set `secrets.create: false` and provision the Secret
    via external-secrets-operator (or sealed-secrets / Vault sidecar). This
    template will then skip generation and the Deployment will reference
    `existingSecretName`.
*/ -}}
{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gui-lop.secretName" . }}
  labels:
    {{- include "gui-lop.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.JWT_SECRET is required when secrets.create=true" .Values.secrets.JWT_SECRET | quote }}
  {{- if .Values.secrets.DATABASE_URL }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  {{- end }}
  {{- if .Values.secrets.REDIS_URL }}
  REDIS_URL: {{ .Values.secrets.REDIS_URL | quote }}
  {{- end }}
{{- end }}
