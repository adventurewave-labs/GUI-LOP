apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gui-lop-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/websocket-services: "gui-lop-app-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/rate-limit-connections: "50"
    nginx.ingress.kubernetes.io/rate-limit-requests-per-second: "25"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
spec:
  tls:
  - hosts:
    - gui-lop.com
    - www.gui-lop.com
    - api.gui-lop.com
    secretName: gui-lop-tls
  rules:
  - host: gui-lop.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gui-lop-app-internal
            port:
              number: 3000
  - host: www.gui-lop.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gui-lop-app-internal
            port:
              number: 3000
  - host: api.gui-lop.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gui-lop-app-internal
            port:
              number: 3000
      - path: /socket.io(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: gui-lop-app-internal
            port:
              number: 3000