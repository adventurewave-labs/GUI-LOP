# ==========================================
# Production Nginx configuration — GUI-LOP SPA
#
# Security headers live in ONE snippet (templates/security-headers.inc.template,
# rendered to conf.d/security-headers.inc) that every SPA `location` includes.
# They used to be set here at http level, but nginx drops ALL inherited
# `add_header` directives in any block that declares its own — so the CSP and
# Permissions-Policy never reached index.html, and /index.html (its own
# Cache-Control) got no security headers at all. Never add `add_header` here.
# ==========================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Don't advertise the nginx version (Server header, error pages).
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/manifest+json
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # HSTS only when the request reached the edge over TLS (Railway / LB set
    # X-Forwarded-Proto). An empty value means nginx sends no header.
    map "$scheme:$http_x_forwarded_proto" $hsts_header {
        default        "";
        "~^https:"     "max-age=63072000; includeSubDomains";
        "~:https$"     "max-age=63072000; includeSubDomains";
    }

    # Upgrade only real WebSocket handshakes; otherwise clear Connection so
    # upstream keepalive works (a fixed 'upgrade' disabled it for every API call).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;

    include /etc/nginx/conf.d/*.conf;
}
