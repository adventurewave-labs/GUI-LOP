# ==========================================
# Prometheus Alerting Rules for GUI-LOP
# Production monitoring and alerting
# ==========================================

groups:
  # ---------------------------------------------------------------------
  # API (metrics the application really exports at /metrics; checked by
  # src/backend/bootstrap/__tests__/alert-rules.test.js so an alert can
  # never again reference a metric that does not exist).
  # SLOs: docs/PRODUCTION_DEPLOYMENT_GUIDE.md "Performance".
  # ---------------------------------------------------------------------
  - name: gui-lop-api
    rules:
      - alert: ApiDown
        expr: up{job="gui-lop-backend"} == 0
        for: 1m
        labels:
          severity: critical
          service: 'gui-lop-backend'
        annotations:
          summary: "API instance {{ $labels.instance }} is not being scraped"
          description: "Prometheus cannot scrape /metrics (process down, or METRICS_TOKEN mismatch)."
          runbook_url: "https://github.com/adventurewave-labs/GUI-LOP/blob/main/docs/RUNBOOK.md#apidown"

      - alert: ApiHighErrorRate
        expr: sum(rate(http_request_duration_seconds_count{status_code=~"5.."}[5m])) / sum(rate(http_request_duration_seconds_count[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
          service: 'gui-lop-backend'
        annotations:
          summary: "More than 1% of API requests are failing (5xx)"
          description: "{{ $value | humanizePercentage }} of requests returned 5xx over 5 minutes (SLO: < 0.1%)."
          runbook_url: "https://github.com/adventurewave-labs/GUI-LOP/blob/main/docs/RUNBOOK.md#apihigherrorrate"

      - alert: ApiLatencyP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{route!~"/api/v1/auth/(login|register|password)"}[5m]))) > 0.25
        for: 10m
        labels:
          severity: warning
          service: 'gui-lop-backend'
        annotations:
          summary: "API p95 latency is above the 250 ms SLO"
          description: "p95 is {{ $value | humanizeDuration }} (login/register/password excluded: bcrypt is slow by design)."
          runbook_url: "https://github.com/adventurewave-labs/GUI-LOP/blob/main/docs/RUNBOOK.md#apilatencyhigh"

      - alert: ApiLatencyP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{route!~"/api/v1/auth/(login|register|password)"}[5m]))) > 0.6
        for: 10m
        labels:
          severity: critical
          service: 'gui-lop-backend'
        annotations:
          summary: "API p99 latency is above the 600 ms SLO"
          description: "p99 is {{ $value | humanizeDuration }}."
          runbook_url: "https://github.com/adventurewave-labs/GUI-LOP/blob/main/docs/RUNBOOK.md#apilatencyhigh"

      - alert: ApiOverloaded
        expr: sum(rate(http_request_duration_seconds_count{status_code="503"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          service: 'gui-lop-backend'
        annotations:
          summary: "API is shedding load (503)"
          description: "{{ $value }} req/s are answered 503 + Retry-After: database timeouts, exhausted pool, or failover."
          runbook_url: "https://github.com/adventurewave-labs/GUI-LOP/blob/main/docs/RUNBOOK.md#apioverloaded"

      - alert: ApiRestarting
        expr: changes(process_start_time_seconds{job="gui-lop-backend"}[15m]) > 2
        for: 0m
        labels:
          severity: critical
          service: 'gui-lop-backend'
        annotations:
          summary: "API process restarted {{ $value }} times in 15 minutes"
          description: "Crash loop: check the boot log for a ConfigError or an unhandled error."
          runbook_url: "https://github.com/adventurewave-labs/GUI-LOP/blob/main/docs/RUNBOOK.md#apirestarting"

      - alert: EventLoopLagHigh
        expr: nodejs_eventloop_lag_p99_seconds{job="gui-lop-backend"} > 0.2
        for: 5m
        labels:
          severity: warning
          service: 'gui-lop-backend'
        annotations:
          summary: "Node.js event loop is blocked"
          description: "p99 event-loop lag is {{ $value | humanizeDuration }}: synchronous work on the request path or CPU saturation."
          runbook_url: "https://github.com/adventurewave-labs/GUI-LOP/blob/main/docs/RUNBOOK.md#eventlooplaghigh"

      - alert: DbPoolSaturated
        expr: db_pool_connections{state="waiting"} > 0
        for: 5m
        labels:
          severity: warning
          service: 'gui-lop-backend'
        annotations:
          summary: "Requests are queueing for a database connection"
          description: "{{ $value }} callers have been waiting for a pooled connection for 5 minutes."
          runbook_url: "https://github.com/adventurewave-labs/GUI-LOP/blob/main/docs/RUNBOOK.md#dbpoolsaturated"

      - alert: OutboxLagHigh
        expr: outbox_oldest_pending_age_seconds > 30
        for: 5m
        labels:
          severity: warning
          service: 'gui-lop-backend'
        annotations:
          summary: "Outbox delivery is lagging"
          description: "The oldest undelivered event is {{ $value | humanizeDuration }} old (SLO: < 30 s)."
          runbook_url: "https://github.com/adventurewave-labs/GUI-LOP/blob/main/docs/RUNBOOK.md#outboxlaghigh"

      - alert: OutboxStalled
        expr: outbox_oldest_pending_age_seconds > 600
        for: 5m
        labels:
          severity: critical
          service: 'gui-lop-backend'
        annotations:
          summary: "Outbox is not draining"
          description: "No event has been delivered for {{ $value | humanizeDuration }}: notifications, webhooks and projections are stopped."
          runbook_url: "https://github.com/adventurewave-labs/GUI-LOP/blob/main/docs/RUNBOOK.md#outboxlaghigh"

      - alert: OutboxMetricsBroken
        expr: outbox_pending_events < 0 or outbox_oldest_pending_age_seconds < 0 or outbox_dead_letter_events < 0
        for: 5m
        labels:
          severity: warning
          service: 'gui-lop-backend'
        annotations:
          summary: "Outbox metrics cannot be read"
          description: "The outbox gauges report -1: the metrics query against Postgres is failing."
          runbook_url: "https://github.com/adventurewave-labs/GUI-LOP/blob/main/docs/RUNBOOK.md#outboxmetricsbroken"

      - alert: OutboxDeadLetters
        expr: outbox_dead_letter_events > 0
        for: 1m
        labels:
          severity: critical
          service: 'gui-lop-backend'
        annotations:
          summary: "{{ $value }} outbox events were dead-lettered"
          description: "Events exhausted their retries; each is a notification/webhook/projection that did not happen. Replay after fixing the cause."
          runbook_url: "https://github.com/adventurewave-labs/GUI-LOP/blob/main/docs/RUNBOOK.md#outboxdeadletters"

      - alert: AiCircuitOpen
        expr: ai_circuit_state{state="open"} == 1
        for: 2m
        labels:
          severity: warning
          service: 'gui-lop-backend'
        annotations:
          summary: "AI provider circuit breaker is open ({{ $labels.provider }})"
          description: "UI generation is failing fast; the provider is erroring or timing out."
          runbook_url: "https://github.com/adventurewave-labs/GUI-LOP/blob/main/docs/RUNBOOK.md#aicircuitopen"

      - alert: AiErrorRateHigh
        expr: sum(rate(ai_call_duration_seconds_count{outcome!="ok"}[10m])) / sum(rate(ai_call_duration_seconds_count[10m])) > 0.2
        for: 10m
        labels:
          severity: warning
          service: 'gui-lop-backend'
        annotations:
          summary: "More than 20% of AI calls are failing"
          description: "{{ $value | humanizePercentage }} of AI provider calls failed over 10 minutes."
          runbook_url: "https://github.com/adventurewave-labs/GUI-LOP/blob/main/docs/RUNBOOK.md#aicircuitopen"

  # Service availability alerts
  - name: gui-lop-service-availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          service: 'gui-lop'
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been down for more than 1 minute."

  # Database alerts
  - name: gui-lop-database
    rules:
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          service: 'gui-lop-postgres'
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database has been down for more than 1 minute."

      - alert: PostgreSQLHighConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          service: 'gui-lop-postgres'
        annotations:
          summary: "PostgreSQL connection count is high"
          description: "PostgreSQL has {{ $value }} active connections."

      - alert: PostgreSQLSlowQueries
        expr: rate(pg_stat_statements_mean_time_seconds[5m]) > 1
        for: 5m
        labels:
          severity: warning
          service: 'gui-lop-postgres'
        annotations:
          summary: "PostgreSQL slow queries detected"
          description: "Average query time is {{ $value }} seconds."

  # Redis alerts
  - name: gui-lop-redis
    rules:
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: 'gui-lop-redis'
        annotations:
          summary: "Redis is down"
          description: "Redis cache has been down for more than 1 minute."

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          service: 'gui-lop-redis'
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage is {{ $value | humanizePercentage }}."

      - alert: RedisLowHitRate
        expr: redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total) < 0.5
        for: 10m
        labels:
          severity: warning
          service: 'gui-lop-redis'
        annotations:
          summary: "Redis hit rate is low"
          description: "Redis cache hit rate is {{ $value | humanizePercentage }}."

  # System alerts
  - name: gui-lop-system
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: 'gui-lop-system'
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: 'gui-lop-system'
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
          service: 'gui-lop-system'
        annotations:
          summary: "Low disk space"
          description: "Disk space is {{ $value }}% available on {{ $labels.instance }}."

      - alert: ContainerHighMemoryUsage
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: 'gui-lop-containers'
        annotations:
          summary: "Container memory usage is high"
          description: "Container {{ $labels.name }} memory usage is {{ $value }}%."

  # Network alerts
  - name: gui-lop-network
    rules:
      - alert: HighNetworkTraffic
        expr: rate(container_network_transmit_bytes_total[5m]) + rate(container_network_receive_bytes_total[5m]) > 104857600
        for: 5m
        labels:
          severity: warning
          service: 'gui-lop-network'
        annotations:
          summary: "High network traffic"
          description: "Network traffic is {{ $value | humanizeBytes }}/second."
