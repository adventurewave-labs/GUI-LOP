version: 2
updates:
  # Backend npm deps — grouped so routine bumps land as one PR per week.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      # Majors grouped too: one reviewable jump per week instead of a wave
      # of single-major PRs that regrows every Monday.
      all-major:
        update-types: [major]
    # Majors held back on purpose (2026-10-22): @babel/preset-env 8 conflicts
    # with the @babel/core-7 polyfill chain (npm ERESOLVE), and typescript 7
    # rejects JSDoc inference patterns tsc 5.9 accepts. Revisit when the
    # ecosystem catches up.
    ignore:
      - dependency-name: "@babel/preset-env"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
      frontend-major:
        update-types: [major]

  # Actions are SHA-pinned; Dependabot rewrites the SHA + version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns: ["*"]
