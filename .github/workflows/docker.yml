name: docker

# Build the production image and smoke-test its HEALTHCHECK against /health.
# Runs only on push to main. **Does not** push to a registry — wire that up
# once registry credentials are provisioned (see TODO below).
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: build + healthcheck smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: |
            gui-lop:ci
            gui-lop:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container in background
        run: |
          docker run -d --name gui-lop-smoke \
            -e DATABASE_URL='' \
            -e REDIS_URL='' \
            -e JWT_SECRET=ci-smoke-secret \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -p 3001:3001 \
            gui-lop:ci

      - name: Wait for /health to return 200
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health >/dev/null; then
              echo "health OK after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "health endpoint never returned 200"
          docker logs gui-lop-smoke || true
          exit 1

      - name: Capture container logs (always)
        if: always()
        run: docker logs gui-lop-smoke || true

      - name: Tear down container
        if: always()
        run: docker rm -f gui-lop-smoke || true

      # TODO: push to registry once credentials are provisioned.
      # - name: Login to registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      # - name: Push image
      #   run: docker push ghcr.io/your-org/gui-lop:${{ github.sha }}
