name: contracts

# Adapter contract tests — real Postgres + Redis via GitHub Actions
# service containers. Blocking: every adapter must honour its port's
# contract against real infrastructure (159 tests as of 2026-10-01).
#
# Runs on PRs to `main` and pushes to `main` / `claude/**`.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "claude/**"

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: adapter contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocking since SOTA round 2 loop 1: all 148 contracts pass on real
    # Postgres + Redis, so a red check here is a real regression.

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: contracts
          POSTGRES_USER: contracts
          POSTGRES_PASSWORD: contracts
        ports:
          - 5432:5432
        # Wait for Postgres to be ready before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U contracts -d contracts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Direct connection URLs (used by tests if they fall back to
      # service-bound connections rather than spinning up testcontainers).
      DATABASE_URL: postgresql://contracts:contracts@localhost:5432/contracts
      REDIS_URL: redis://localhost:6379
      # Fixtures use the service containers directly (one throwaway
      # database per suite) instead of booting testcontainers.
      CONTRACTS_DATABASE_URL: postgresql://contracts:contracts@localhost:5432/contracts
      CONTRACTS_REDIS_URL: redis://localhost:6379
      # The testcontainers-node package autodetects Docker via the
      # standard socket; on GitHub-hosted runners docker.sock is exposed
      # and tests can also boot their own containers if preferred.
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-used-in-prod

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run contract test suites
        run: npm run test:contracts

      # Production-mode smoke (roadmap P4): fresh database, migrations only
      # (no seeds), NODE_ENV=production boot, then a real user journey via
      # scripts/smoke.mjs — the path that exposed the Postgres-only bugs the
      # unit/contract suites missed.
      - name: Production-mode smoke
        env:
          PGPASSWORD: contracts
          SMOKE_DB: postgresql://contracts:contracts@localhost:5432/smoke
        run: |
          psql -h localhost -U contracts -d contracts -c 'DROP DATABASE IF EXISTS smoke' -c 'CREATE DATABASE smoke'
          DATABASE_URL=$SMOKE_DB npm run -s db:migrate
          DATABASE_URL=$SMOKE_DB npm run -s db:migrate   # idempotent re-run
          export METRICS_TOKEN=$(openssl rand -hex 16)
          NODE_ENV=production PORT=38080 RATE_LIMIT_MAX=100000000 AUTH_REGISTER_IP_LIMIT=100 JWT_SECRET=$(openssl rand -hex 32) \
            CORS_ORIGINS=https://app.example.com DATABASE_URL=$SMOKE_DB REDIS_URL=redis://localhost:6379 \
            node src/backend/bootstrap/index.js > smoke-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:38080/livez >/dev/null && break; sleep 1; done
          node scripts/smoke.mjs --base http://localhost:38080 --metrics-token "$METRICS_TOKEN" --database-url "$SMOKE_DB"

      # Short load pass as a regression tripwire (docs/PRODUCTION_DEPLOYMENT_GUIDE.md
      # has the SLOs and the baseline). Thresholds are loose: shared runners are noisy.
      - name: Load tripwire (mixed, 10 users, 10 s)
        run: node scripts/load.mjs --base http://localhost:38080 --scenario mixed --concurrency 10 --duration 10 --p95 500 --p99 1500 --max-error-rate 0.01

      # Backup → restore drill (roadmap P7) on the database the smoke and load
      # steps just filled, then boot the API on nothing but the restored copy.
      - name: Backup / restore drill
        env:
          SMOKE_DB: postgresql://contracts:contracts@localhost:5432/smoke
        run: |
          fuser -k 38080/tcp || true   # no writers while row counts are compared
          sleep 1
          RESTORED=$(DATABASE_URL=$SMOKE_DB DRILL_KEEP=1 bash database/scripts/db-backup.sh drill | tail -n 1)
          NODE_ENV=production PORT=38081 AUTH_REGISTER_IP_LIMIT=100 JWT_SECRET=$(openssl rand -hex 32) \
            CORS_ORIGINS=https://app.example.com DATABASE_URL=$RESTORED REDIS_URL=redis://localhost:6379 \
            node src/backend/bootstrap/index.js > restore-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:38081/livez >/dev/null && break; sleep 1; done
          node scripts/smoke.mjs --base http://localhost:38081 --database-url "$RESTORED"

      - name: Smoke server log on failure
        if: failure()
        run: tail -n 200 smoke-server.log restore-server.log || true

      - name: Upload contract-test artefacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-test-logs
          path: |
            **/jest-*.log
            **/contracts-*.log
          if-no-files-found: ignore
          retention-days: 7
