name: arch-lint

# Enforces the four-layer hexagonal boundary rules from
# `.dependency-cruiser.cjs`. Runs on every PR and push to main.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: arch-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-cruiser:
    name: dependency-cruiser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dependency-cruiser is intentionally NOT in the dependency tree
      # (it's a build-time-only tool). Use npx with a pinned version so the
      # workflow stays deterministic.
      - name: Run architecture lint
        run: npx --yes -p dependency-cruiser@16 depcruise --config .dependency-cruiser.cjs src/backend

  eslint:
    name: eslint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ESLint 9 flat config (eslint.config.js): @eslint/js recommended,
      # eslint-plugin-n, eslint-plugin-security. Zero warnings allowed.
      - name: Lint backend
        run: npm run lint
