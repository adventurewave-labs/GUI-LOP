name: bench

# Benchmark suite. Runs on push-to-main only; the result is uploaded as a
# build artifact for trend tracking. **Not** a merge gate (informational).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmarks:
    name: SLO benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run benchmarks
        env:
          # ADR 0021 note: the SLO suite pins factor 10 on commodity hardware.
          BCRYPT_WORK_FACTOR: "10"
        run: npm run bench

      - name: Upload latest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-results-${{ github.sha }}
          path: |
            tests/benchmarks/results/latest.json
            tests/benchmarks/results/latest.md
          if-no-files-found: warn
          retention-days: 30
