name: bench

# Benchmark suite. Runs on push-to-main only; the result is uploaded as a
# build artifact for trend tracking. **Not** a merge gate (informational).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmarks:
    name: SLO benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run benchmarks
        env:
          # ADR 0021 note: the SLO suite pins factor 10 on commodity hardware.
          BCRYPT_WORK_FACTOR: "10"
        run: npm run bench

      - name: Upload latest results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results-${{ github.sha }}
          path: |
            tests/benchmarks/results/latest.json
            tests/benchmarks/results/latest.md
          if-no-files-found: warn
          retention-days: 30
