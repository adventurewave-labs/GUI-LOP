name: bench

# Benchmark suite. Runs on push-to-main only; the result is uploaded as a
# build artifact for trend tracking. **Not** a merge gate (informational).
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmarks:
    name: SLO benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run benchmarks
        env:
          # ADR 0021 note: the SLO suite pins factor 10 on commodity hardware.
          BCRYPT_WORK_FACTOR: "10"
        run: npm run bench

      - name: Upload latest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: |
            tests/benchmarks/results/latest.json
            tests/benchmarks/results/latest.md
          if-no-files-found: warn
          retention-days: 30
