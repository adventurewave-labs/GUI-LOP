name: ci

# Backend test gate. Required for merge.
# Runs on every PR plus pushes to main and any claude/** branch so the
# bot's PR previews still get a green check.
on:
  pull_request:
  push:
    branches:
      - main
      - "claude/**"

# Cancel superseded runs on the same branch.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 24 = Active LTS (default runtime, Docker image); 22 = engines floor.
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        # Strict checkJs over every file carrying `// @ts-check` (shared-kernel
        # + bootstrap today; repo-policy test enforces it there). Blocking.
        run: npm run typecheck

      - name: Backend + integration tests
        env:
          NODE_ENV: test
          # Bootstrap falls back to in-memory adapters when these are unset.
          DATABASE_URL: ""
          REDIS_URL: ""
          JWT_SECRET: ci-test-secret-not-used-in-prod
        # Coverage on every leg: the per-area ratchet floors in
        # jest.backend.config.js fail the job if coverage drops (roadmap #15).
        run: npm run test:coverage:backend

      - name: Upload coverage report
        if: always() && matrix.node == '24'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Frontend service tests (WebSocket client)
        run: npm run test:frontend-services
